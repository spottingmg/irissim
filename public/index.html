<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bahnsteiganzeiger</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="setup" class="setup-screen">
    <h1>Bahnsteiganzeiger</h1>
    <label>Bahnhof (RIL100-Code oder Name)
      <input id="input-bahnhof" type="text" placeholder="z.B. KM oder Mönchengladbach" />
    </label>
    <label>Gleis
      <input id="input-gleis" type="text" placeholder="z.B. 3" />
    </label>
    <button id="btn-start">Anzeige starten</button>
    <p id="setup-error" class="error"></p>
  </div>

  <div id="board" class="board hidden">
    <div class="focus-train">
      <div class="focus-row focus-row-top">
        <span id="focus-time" class="focus-time">--:--</span>
        <span id="focus-line" class="focus-line">---</span>
        <span id="focus-dest" class="focus-dest">-----------------</span>
        <span id="focus-gleis" class="focus-gleis">Gl. -</span>
      </div>
      <div id="focus-via" class="focus-via"></div>
      <div id="focus-status" class="focus-status"></div>
    </div>

    <div class="wagenstand" id="wagenstand"></div>

    <div class="mini-list" id="mini-list"></div>
  </div>

  <audio id="announcement-audio" preload="none"></audio>

  <script src="js/app.js"></script>
</body>
</html>
